# Solo la interfaz web (nginx) queda publicada. La base y la API se alcanzan únicamente por la red
# interna; nginx pasa /api/* al backend.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agro
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [interna]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agro:${POSTGRES_PASSWORD:-agro}@db:5432/agro
      STORAGE_DIR: /data/archivos
    volumes:
      - archivos:/data/archivos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [interna]

  # Interfaz web: http://localhost:8080
  web:
    build: ./frontend
    ports:
      - "${WEB_PUERTO:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks: [interna]

  # HTTPS con certificado automático de Let's Encrypt (requiere DOMINIO apuntando a este servidor
  # y los puertos 80/443 abiertos): docker compose --profile https up -d
  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    networks:
      interna:
        ipv4_address: 172.30.0.10  # nginx confía en el X-Forwarded-For solo de esta IP
    profiles: ["https"]

  # Copia diaria de la base y de los archivos en ./backups
  backup:
    image: postgres:16
    environment:
      PGHOST: db
      PGUSER: agro
      PGDATABASE: agro
      PGPASSWORD: ${POSTGRES_PASSWORD:-agro}
      BACKUP_DIAS: ${BACKUP_DIAS:-30}
      BACKUP_HORA: ${BACKUP_HORA:-03}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    entrypoint: ["sh", "/scripts/backup.sh"]
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
      - archivos:/data/archivos:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  # Desarrollo del frontend con recarga en caliente: http://localhost:5173
  web-dev:
    image: node:22-alpine
    working_dir: /w
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/w
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    networks: [interna]
    profiles: ["dev"]

  # Dashboards sin programar, conectados directo a Postgres: http://localhost:3000
  # Solo accesible desde esta máquina; para usarlo desde otra, ponerlo detrás de Caddy.
  metabase:
    image: metabase/metabase:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
    networks: [interna]
    profiles: ["dashboards"]

networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  archivos:
  caddy_data:
  caddy_config:
