# Login: como mucho 10 intentos por minuto por IP (la API además bloquea por email).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # IP real del cliente: solo se confía en el X-Forwarded-For que manda Caddy (perfil https),
    # que tiene una IP fija en la red interna. A cualquier otro se le ignora el encabezado.
    set_real_ip_from 172.30.0.10;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/seguridad.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; object-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 25m;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/seguridad.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://api:8000/auth/login;
    }

    # API: se quita el prefijo /api y se pasa al backend
    location /api/ {
        include /etc/nginx/snippets/seguridad.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://api:8000/;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la SPA (/facturas/12, etc.)
    location / {
        try_files $uri /index.html;
    }
}
