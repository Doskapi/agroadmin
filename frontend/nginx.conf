# Protocolo original: si el pedido viene de Caddy (HTTPS) se respeta su X-Forwarded-Proto.
map $http_x_forwarded_proto $protocolo {
    default $scheme;
    https   https;
}

# Login: como mucho 10 intentos por minuto por IP (la API además bloquea por email).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # IP real del cliente: solo se confía en el X-Forwarded-For que manda Caddy (perfil https),
    # que tiene una IP fija en la red interna. A cualquier otro se le ignora el encabezado.
    set_real_ip_from 172.30.0.10;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/seguridad.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; object-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 25m;

    # La IP de la API se vuelve a resolver con el DNS de Docker (si el contenedor se recrea, cambia).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/seguridad.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        rewrite ^ /auth/login break;
        proxy_pass $api;
    }

    # API: se quita el prefijo /api y se pasa al backend
    location /api/ {
        include /etc/nginx/snippets/seguridad.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_read_timeout 120s;
    }

    # El service worker y el manifest se revisan siempre (si no, una versión vieja de la app quedaría pegada)
    location = /sw.js {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la SPA (/facturas/12, etc.)
    location / {
        try_files $uri /index.html;
    }
}
