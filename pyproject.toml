[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "B008",  # Depends(...) en valores por defecto es el patrón de FastAPI
    "S101",  # assert en tests
    "S608",  # SQL armado: solo con identificadores fijos (ver app/seed.py)
    "UP038", # isinstance con tuplas es más claro (y la regla está deprecada)
    "S105",  # falsos positivos: valores por defecto de desarrollo que la app rechaza en producción (app/config.py)
    "S107",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
